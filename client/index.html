<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Space Grotesk for figures and headings, IBM Plex Sans for prose -- the glass theme's
         two faces. preconnect because the CSS and the font files sit on different origins and
         the second DNS round trip is otherwise paid after the stylesheet has already parsed.
         display=swap so text paints in the fallback immediately rather than staying invisible
         while the webfont downloads; both stacks below name a real local fallback, so a
         blocked Google Fonts leaves the app legible rather than in Times. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <!-- The seasonal themes: Creepster (spooky.css) / Mountains of Christmas (xmas.css) for titles and the logo, Inter for the rest. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Mountains+of+Christmas:wght@700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>GSuite</title>
    <script>
      // Runs before first paint so a dark-mode user never sees a flash of the light theme.
      // Deliberately inline and dependency-free -- a module import would be deferred until
      // after the page has already painted. Mirrors resolveTheme() in src/utils/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'glass'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          // 'glass' is a dark theme as far as the browser's own widgets are concerned; passing
          // the name through would leave a near-black page with light scrollbars.
          document.documentElement.style.colorScheme = theme === 'glass' ? 'dark' : theme;
          // The seasonal theme (src/utils/season.js): the admin's company-wide choice ('season-admin':
          // auto | halloween | christmas | off; auto = Oct-Nov Halloween, Dec Christmas), unless this
          // user switched it off for themselves ('season-user' = off; older 'season' / 'season-theme' = off).
          var choice = localStorage.getItem('season-admin');
          if (['auto', 'halloween', 'christmas', 'off'].indexOf(choice) < 0) choice = 'auto';
          var userOn = localStorage.getItem('season-user');
          if (userOn !== 'on' && userOn !== 'off') userOn = localStorage.getItem('season') === 'off' || localStorage.getItem('season-theme') === 'off' ? 'off' : 'on';
          if (userOn === 'off') choice = 'off';
          var m = new Date().getMonth();
          var season = choice === 'off' ? '' : choice === 'halloween' ? 'spooky' : choice === 'christmas' ? 'christmas'
            : (m === 9 || m === 10 ? 'spooky' : (m === 11 ? 'christmas' : ''));
          if (season) {
            // Both are dark redesigns: html.spooky (styles/spooky.css) / html.xmas (styles/xmas.css).
            document.documentElement.dataset.season = season;
            document.documentElement.classList.add(season === 'spooky' ? 'spooky' : 'xmas');
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
          }
          // Same pre-paint reasoning for the user's uploaded background: applied from the
          // cached copy here so it is already on screen at first paint instead of dropping
          // in after React mounts. Mirrors applyBackground() in src/utils/background.js;
          // the server copy replaces this one once /me/background answers.
          var bg = localStorage.getItem('app-background');
          if (bg && bg.indexOf('data:image/') === 0 && /^[A-Za-z0-9+/=:;,.-]+$/.test(bg)) {
            document.documentElement.style.setProperty('--app-bg-image', 'url("' + bg + '")');
            document.documentElement.dataset.bg = 'on';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
